version: '3.8'

services:
  # 1. NGINX Reverse Proxy & Frontend Static File Server
  nginx:
    image: nginx:1.25-alpine
    container_name: drishtiq-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
      - ai-ml-engine

  # 2. Django REST Framework Backend Service
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: drishtiq-backend
    restart: always
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - SECRET_KEY=${SECRET_KEY:-production-secret-key-automotive-insights}
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongo:27017/drishtiq_db}
      - REDIS_URL=redis://redis:6379/0
    expose:
      - "8000"
    depends_on:
      - redis
      - mongo

  # 3. AI/ML Inference Microservice Engine
  ai-ml-engine:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: drishtiq-aiml-service
    restart: always
    command: python ai_ml/inference_service.py
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ../ai_ml/models:/app/ai_ml/models

  # 4. Celery Worker for Real-time Telemetry & Anomaly Processing
  celery-worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: drishtiq-celery-worker
    restart: always
    command: celery -A config worker --loglevel=info
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
      - backend

  # 5. Redis In-Memory Database & Message Broker
  redis:
    image: redis:7-alpine
    container_name: drishtiq-redis
    restart: always
    ports:
      - "6379:6379"

  # 6. MongoDB Enterprise Local Data Store
  mongo:
    image: mongo:7.0
    container_name: drishtiq-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
    driver: local
