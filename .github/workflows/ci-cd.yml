name: Enterprise CI/CD Pipeline - DrishtIQ Automotive Intelligence Platform

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-lint-and-test:
    name: Backend API Service Quality & Security Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install flake8 pytest

      - name: Code Quality & Linting (Flake8)
        run: |
          flake8 backend --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 backend --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Execute Django Unit & Integration Tests
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development
          SECRET_KEY: ci-cd-secret-key-testing-only
        run: |
          cd backend
          python manage.py check

  frontend-lint-and-build:
    name: React Dashboard Web Application Build & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci || npm install

      - name: TypeScript Type Checking
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Build Production Assets
        run: |
          cd frontend
          npm run build

  ai-ml-pipeline-test:
    name: AI/ML Predictive Engines & Model Training
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install AI/ML Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ai_ml/requirements.txt

      - name: Train AI/ML Models & Validate Artifacts
        run: |
          python ai_ml/train/train_all_models.py

      - name: Run Model Inference Service Verification
        run: |
          python ai_ml/inference_service.py

  docker-build-check:
    name: Production Container Image Build Verification
    runs-on: ubuntu-latest
    needs: [backend-lint-and-test, frontend-lint-and-build, ai-ml-pipeline-test]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: drishtiq/backend:latest
